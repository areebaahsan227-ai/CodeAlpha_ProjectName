<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2ee"><title>Goodword — A Quote for Today</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#252820;--muted:#7a7d75;--paper:#f4f2ee;--green:#456b52;--line:#e4e1da;--white:#fffefa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}.page{max-width:1120px;margin:auto;padding:30px 36px}.header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:700;letter-spacing:-.7px}.logo b{color:var(--green)}.date{color:var(--muted);font-size:12px;letter-spacing:.11em;text-transform:uppercase}.main{min-height:calc(100vh - 110px);display:grid;grid-template-columns:.8fr 1.2fr;align-items:center;gap:70px;padding:40px 0 68px}.visual{position:relative;min-height:450px;background:#e7e9df;border-radius:4px 120px 4px 4px;overflow:hidden;display:flex;align-items:center;justify-content:center}.sun{position:absolute;width:250px;height:250px;border-radius:50%;background:#f2d4a7;top:78px;left:50%;transform:translateX(-38%)}.hill1,.hill2{position:absolute;width:145%;height:250px;border-radius:50% 50% 0 0;left:-20%;bottom:-105px;background:#9caf91;transform:rotate(-9deg)}.hill2{background:#617e64;left:-4%;bottom:-160px;transform:rotate(8deg)}.branch{position:absolute;left:18%;top:18%;width:2px;height:170px;background:#55715b;transform:rotate(-35deg);transform-origin:top}.branch:before,.branch:after{content:'';position:absolute;width:58px;height:25px;border:2px solid #55715b;border-left:0;border-bottom:0;border-radius:0 100% 0 100%;transform:rotate(-25deg);top:30px;left:0}.branch:after{top:78px;left:-44px;transform:rotate(155deg)}.visual-label{position:absolute;left:24px;bottom:22px;color:#fff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}.copy{max-width:560px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);text-transform:uppercase;font-weight:700;margin:0 0 24px}.quote-mark{font:700 68px/.65 'Playfair Display',serif;color:#9caf91}.quote{font:600 clamp(30px,4vw,48px)/1.28 'Playfair Display',Georgia,serif;letter-spacing:-.8px;margin:18px 0 26px;transition:opacity .18s}.author{font-size:14px;color:#687064;display:flex;align-items:center;gap:12px}.author:before{content:'';width:26px;height:1px;background:#91a18a}.actions{display:flex;align-items:center;gap:18px;margin-top:42px}.new{display:flex;align-items:center;gap:11px;border:0;background:var(--green);color:white;padding:14px 20px;border-radius:4px;font-weight:600;transition:background .2s,transform .2s}.new:hover{background:#355840;transform:translateY(-1px)}.new span{font-size:18px}.copybtn{border:0;background:transparent;color:#73786f;padding:12px 0;font-size:13px}.copybtn:hover{color:var(--green)}.footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;padding-top:18px;color:#888b83;font-size:11px;letter-spacing:.04em}.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);background:#29362b;color:white;border-radius:5px;padding:11px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.page{padding:22px 20px}.main{grid-template-columns:1fr;gap:38px;padding:42px 0}.visual{min-height:290px;max-width:500px;width:100%;margin:auto}.sun{width:190px;height:190px;top:44px}.hill1{height:170px;bottom:-82px}.hill2{bottom:-125px}.copy{margin:auto;width:100%}.quote{font-size:36px}.footer{gap:15px}.date{font-size:10px}}@media(max-width:400px){.date{display:none}.quote{font-size:31px}.actions{margin-top:30px}}
</style></head><body><div class="page"><header class="header"><div class="logo">goodword<b>.</b></div><div class="date" id="date"></div></header><main class="main"><div class="visual" aria-hidden="true"><div class="sun"></div><div class="branch"></div><div class="hill1"></div><div class="hill2"></div><div class="visual-label">A moment for yourself</div></div><section class="copy"><p class="eyebrow">A little perspective</p><div class="quote-mark">“</div><blockquote class="quote" id="quote" aria-live="polite"></blockquote><div class="author" id="author"></div><div class="actions"><button class="new" id="new"><span>↻</span> New quote</button><button class="copybtn" id="copy">Copy quote</button></div></section></main><footer class="footer"><span>WORDS TO CARRY WITH YOU</span><span id="count"></span></footer></div><div class="toast" id="toast" role="status"></div>
<script>
const quotes=[
{text:'It always seems impossible until it’s done.',author:'Nelson Mandela'},
{text:'The secret of getting ahead is getting started.',author:'Mark Twain'},
{text:'How we spend our days is, of course, how we spend our lives.',author:'Annie Dillard'},
{text:'Nothing will work unless you do.',author:'Maya Angelou'},
{text:'Great things are done by a series of small things brought together.',author:'Vincent van Gogh'},
{text:'The only way to do great work is to love what you do.',author:'Steve Jobs'},
{text:'Adopt the pace of nature: her secret is patience.',author:'Ralph Waldo Emerson'},
{text:'It is never too late to be what you might have been.',author:'George Eliot'},
{text:'No act of kindness, no matter how small, is ever wasted.',author:'Aesop'},
{text:'Nothing is worth more than this day.',author:'Johann Wolfgang von Goethe'},
{text:'Do what you can, with what you have, where you are.',author:'Theodore Roosevelt'},
{text:'A journey of a thousand miles begins with a single step.',author:'Lao Tzu'},
{text:'Turn your wounds into wisdom.',author:'Oprah Winfrey'},
{text:'The purpose of our lives is to be happy.',author:'Dalai Lama'},
{text:'Life is really simple, but we insist on making it complicated.',author:'Confucius'},
{text:'Act as if what you do makes a difference. It does.',author:'William James'},
{text:'You must do the thing you think you cannot do.',author:'Eleanor Roosevelt'},
{text:'Wherever you go, go with all your heart.',author:'Confucius'},
{text:'In the middle of difficulty lies opportunity.',author:'Albert Einstein'},
{text:'The best way out is always through.',author:'Robert Frost'}];let last=-1;const q=document.getElementById('quote'),a=document.getElementById('author');function next(){let n;do{n=Math.floor(Math.random()*quotes.length)}while(n===last);last=n;q.style.opacity=0;setTimeout(()=>{q.textContent=quotes[n].text;a.textContent=quotes[n].author;q.style.opacity=1;document.getElementById('count').textContent=`${String(n+1).padStart(2,'0')} / ${quotes.length}`},120)}document.getElementById('new').onclick=next;document.getElementById('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());let timer;function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(`“${q.text}” — ${a.text}`);notify('Quote copied to clipboard')}catch{const r=document.createRange();r.selectNodeContents(q);getSelection().removeAllRanges();getSelection().addRange(r);notify('Select and copy the quote')}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}});next();
</script></body></html>
